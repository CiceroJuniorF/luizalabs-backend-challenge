version: '3'

services:

  # DB SERVICES
  mongo:
    image: mongo:7.0.7
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: "ccoder" 
      MONGO_INITDB_ROOT_PASSWORD: "d8a928b2043db77e340b523547bf16cb4aa483f0645fe0a290ed1f20aab76257"
    ports:
      - "27017:27017"
    volumes:
      - /.data/mongodbs:/data/db
    networks:
      - mongo-compose-network

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: "ccoder"
      ME_CONFIG_MONGODB_ADMINPASSWORD: "d8a928b2043db77e340b523547bf16cb4aa483f0645fe0a290ed1f20aab76257"
      ME_CONFIG_MONGODB_SERVER: "mongo"
      ME_CONFIG_MONGODB_PORT: 27017 
      ME_CONFIG_BASICAUTH_USERNAME: "user"
      ME_CONFIG_BASICAUTH_PASSWORD: "pass"
    ports:
      - "8081:8081" 
    networks:
      - mongo-compose-network
    depends_on:
      - mongo
  
  api:
    build: .
    environment:
      MONGODB_URL: "mongodb://mongo:27017"
    ports:
      - "8000:8000"
    networks:
      - mongo-compose-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  # Observability services
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.2
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=
      - ELASTICSEARCH_PASSWORD=
      - xpack.security.enabled=false
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.8.2
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml
    depends_on:
      - elasticsearch


networks:
  mongo-compose-network:
    driver: bridge
